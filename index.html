<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIR-CRAFT - Military Aviation Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="promo-banner">
        SPECIAL OFFER: Get 10% OFF on purchases over $100,000,000!
    </div>
    <header>
        <div class="container navbar">
            <div class="logo">AIR-<span>CRAFT</span></div>
            <nav>
                <button id="cartBtn" class="btn btn-outline" style="font-size: 0.8rem;">Cart (<span
                        id="cartCount">0</span>)</button>

                <a href="profile.html" class="btn btn-outline" style="font-size: 0.8rem;">Profile</a>
                <button class="btn btn-outline logout-btn" style="font-size: 0.8rem;">Log Out</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="filters">
            <button class="btn btn-outline active filter-btn" data-filter="all">Whole World</button>
            <button class="btn btn-outline filter-btn" data-filter="american">USA</button>
            <button class="btn btn-outline filter-btn" data-filter="russian">Russia</button>
            <button class="btn btn-outline filter-btn" data-filter="european">Europe</button>
            <button class="btn btn-outline filter-btn" data-filter="indian">India</button>
            <button class="btn btn-outline filter-btn" data-filter="chinese">China</button>
        </section>

        <div id="aircraftGrid" class="aircraft-grid">
            <!-- Aircraft cards will be inserted here by JS -->
        </div>
    </main>



    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <button class="modal-close cart-close">&times;</button>
            <h2 style="margin-bottom: 0.5rem;">Shopping Cart</h2>

            <div class="cart-items" id="cartItemsContainer">
                <!-- Cart items will be here -->
                <p style="text-align: center; color: var(--text-muted); margin: 2rem 0;">Your cart is empty.</p>
            </div>

            <div class="cart-summary" id="cartSummary">
                <div class="cart-total-row">
                    <span>Subtotal:</span>
                    <span id="cartSubtotal">$0</span>
                </div>
                <div class="cart-total-row discount-row" id="cartDiscountRow" style="display: none;">
                    <span>Discount (10%):</span>
                    <span id="cartDiscount">-$0</span>
                </div>
                <div class="cart-total-row final-total">
                    <span>Total:</span>
                    <span id="cartFinalTotal">$0</span>
                </div>
            </div>

            <button id="checkoutBtn" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Buy Now</button>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>

</html>
